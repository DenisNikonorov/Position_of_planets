version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: planets-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planets_position
    ports:
      # 5433 на хосте, чтобы не конфликтовать с уже установленным локальным PostgreSQL на 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DESIGN: hever
      ADMINER_PLUGINS: dark-switcher
    container_name: planets-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest # Либо latest
    container_name: minio-server
    restart: always
    ports:
      - "9000:9000"   # API (для загрузки и получения файлов по HTTP)
      - "9001:9001"   # Console (веб-интерфейс)
    environment:
      MINIO_ROOT_USER: "admin"       # Логин по умолчанию
      MINIO_ROOT_PASSWORD: "adminpassword" # Пароль (смените при необходимости)
    volumes:
      - minio_data:/data                  # Хранилище загруженных файлов
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
