version: '3.8'

services:
  minio:
    image: minio/minio:latest # Либо latest
    container_name: minio-server
    restart: always
    ports:
      - "9000:9000"   # API (для загрузки и получения файлов по HTTP)
      - "9001:9001"   # Console (веб-интерфейс)
    environment:
      MINIO_ROOT_USER: "admin"       # Логин по умолчанию
      MINIO_ROOT_PASSWORD: "adminpassword" # Пароль (смените при необходимости)
    volumes:
      - minio_data:/data                  # Хранилище загруженных файлов
    command: server /data --console-address ":9001"

volumes:
  minio_data:
    driver: local
