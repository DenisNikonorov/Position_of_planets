<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление</title>
    <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
    <div class="add-container">
        <h1 class="add-title">Добавление данных</h1>
        <p class="add-subtitle">Покажите новую планету — шаг 1 из 2</p>

        <form action="/add" method="POST" enctype="multipart/form-data">
            <label class="add-label">Медиафайл (фото/видео)</label>
            <label class="media-dropzone" id="dropzone">
                <div class="media-dropzone-icons">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <svg viewBox="0 0 24 24">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                </div>
                <p class="media-dropzone-text" id="dropzoneText">Перетащите видео или сделайте снимок</p>
                <div class="media-preview" id="mediaPreview" hidden></div>
                <input type="file" name="media" id="mediaInput" accept="image/*,video/mp4">
            </label>

            <div class="form-group">
                <label class="add-label">Название планеты</label>
                <input type="text" name="name" class="form-input" placeholder="Например: Марс" required>
            </div>

            <button type="submit" class="step-btn">Далее</button>
        </form>
    </div>

    <nav class="bottom-nav">
        <a href="/feed" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="22" y2="12"/>
            </svg>
            Лента
        </a>
        <a href="/add" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            Добавить
        </a>
        <a href="/tile" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Плитка
        </a>
    </nav>

    <script>
    (function () {
        var dropzone = document.getElementById('dropzone');
        var input = document.getElementById('mediaInput');
        var preview = document.getElementById('mediaPreview');
        var text = document.getElementById('dropzoneText');

        function showPreview(file) {
            if (!file) return;
            if (preview.dataset.url) URL.revokeObjectURL(preview.dataset.url);

            var isVideo = file.type === 'video/mp4' || /\.mp4$/i.test(file.name);
            var url = URL.createObjectURL(file);
            preview.dataset.url = url;
            preview.innerHTML = '';

            var el;
            if (isVideo) {
                el = document.createElement('video');
                el.src = url;
                el.muted = true;
                el.loop = true;
                el.autoplay = true;
                el.controls = true;
            } else {
                el = document.createElement('img');
                el.src = url;
                el.alt = file.name;
            }
            el.className = 'preview-media';
            preview.appendChild(el);
            preview.hidden = false;
            if (text) text.textContent = file.name;
        }

        input.addEventListener('change', function () {
            showPreview(input.files[0]);
        });

        ['dragenter', 'dragover'].forEach(function (evt) {
            dropzone.addEventListener(evt, function (e) {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(function (evt) {
            dropzone.addEventListener(evt, function (e) {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.remove('dragover');
            });
        });

        dropzone.addEventListener('drop', function (e) {
            var files = e.dataTransfer.files;
            if (files && files.length > 0) {
                input.files = files;
                showPreview(files[0]);
            }
        });
    })();
    </script>
</body>
</html>
