<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плитка</title>
    <link rel="stylesheet" href="/style.css?v=2">
</head>
<body>
    <div class="tile-container">
        <div class="filter-block">
            <div class="filter-header">
                <span class="filter-label">Макс. расстояние (AU)</span>
                <span class="filter-value" id="filterVal">{{.maxDist}}</span>
            </div>
            <form action="/tile" method="GET" class="filter-form">
                <input type="range" name="maxDist" class="filter-slider" id="distSlider" min="0" max="12" step="0.1" value="{{.maxDist}}">
                <button type="submit" class="filter-btn">Найти</button>
            </form>
            <div class="filter-marks">
                <span>0</span>
                <span>6</span>
                <span>12</span>
            </div>
        </div>

        <div class="tiles-grid">
            {{range .planets}}
            <div class="tile-card">
                <a href="/feed?id={{.ID}}" class="tile-card-link">
                    <div class="tile-card-media">
                    {{if .HasVideo}}
                    <video autoplay muted loop playsinline>
                        <source src="{{.URLVideo}}" type="video/mp4">
                    </video>
                    {{else}}
                        {{if .ImageURL}}
                        <img src="{{.ImageURL}}" alt="{{.Name}}">
                        {{else}}
                        <div class="media-placeholder">{{.Name}}</div>
                        {{end}}
                    {{end}}
                    </div>
                    <div class="tile-card-info">
                        <div class="tile-card-name">{{.Name}}</div>
                        {{if .ObservationDate}}<div class="tile-card-date">{{.ObservationDate}}</div>{{end}}
                        <div class="tile-card-meta">
                            <span class="tile-card-likes">
                                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                {{.LikesCount}}
                            </span>
                            <span class="tile-card-distance">{{.DistanceFromSun}} AU</span>
                        </div>
                    </div>
                </a>
                <form action="/delete-planet" method="POST" class="tile-delete">
                    <input type="hidden" name="planet_id" value="{{.ID}}">
                    <input type="hidden" name="redirect_to" value="/tile?maxDist={{$.maxDist}}">
                    <button type="submit" class="delete-btn" title="Удалить планету">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            <line x1="10" y1="11" x2="10" y2="17"/>
                            <line x1="14" y1="11" x2="14" y2="17"/>
                        </svg>
                    </button>
                </form>
            </div>
            {{end}}
        </div>
    </div>

    <script>
    (function(){
        var slider = document.getElementById('distSlider');
        var val = document.getElementById('filterVal');
        slider.addEventListener('input', function(){
            val.textContent = this.value;
        });
    })();
    </script>

    <nav class="bottom-nav">
        <a href="/feed" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="22" y2="12"/>
            </svg>
            Лента
        </a>
        <a href="/add" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            Добавить
        </a>
        <a href="/tile" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Плитка
        </a>
    </nav>
</body>
</html>
